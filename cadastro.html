<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG/cadastro</title>
</head>
<body>
   <header>
    <img src="" alt="logo da ONG">
    <h1>Organização Não Governamental</h1>
    <nav>
        <a href="index.html">Sobre Nós</a>
        <a href="projetos.html">Projetos</a>
        <a href="contato.html">Cadastre-se</a>
    </nav>
   </header> 
   <hr>
   <main>
    <section>
        <h2>Cadastro</h2>
        <form>
            <fieldset>
                <legend>Dados Pessoais</legend>

                <label for="name">Nome(completo)*:</label>
                <input type="text" id="name" name="name" required>

                <label for="cpf">CPF*:</label>
                <input type="text" id="cpf" pattern="[0-9]{3}/.[0-9]{3}/.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" title="Formato exigido: 000.000.000-00" name="cpf" required>

                <label for="date">Data de Nascimento:</label>
                <input type="date" id="date" required>

                <label for="phone">Telefone:</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

            </fieldset>    

            <fieldset>  
                <legend>Endereço</legend>

                <label for="address">Endereço:</label>
                <input type="text" id="address" required>

                <label>CEP</label>
                <input type="text" id="postcode" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" title="Formato exigido: 00000-000" required>

                <label for="city">Cidade:</label>
                <input type="text" id="city" required>

                <label for="state">Estado</label>
                <input list="states" id="state" required>
                <datalist id="states">
                    <option value="Rio-Branco">AC</option>
                    <option value="Maceio">AL</option>
                    <option value="Macapa">AP</option>
                    <option value="Manaus">AM</option>
                    <option value="Salvador">BA</option>
                    <option value="Fortaleza">CE</option>
                    <option value="Vitoria">ES</option>
                    <option value="Goiania">GO</option>
                    <option value="Sao-Luis">MA</option>
                    <option value="Cuiaba">MT</option>
                    <option value="Campo-Grande">MS</option>
                    <option value="Belo-Horizonte">MG</option>
                    <option value="Belem">PA</option>
                    <option value="João-Pessoa">PB</option>
                    <option value="Curitiba">PR</option>
                    <option valur="Recife">PE</option>
                    <option value="Teresina">PI</option>  
                    <option value="Rio-de-Janeiro">RJ</option> 
                    <option value="Natal">RN</option> 
                    <option value="Porto-Alegre">RS</option> 
                    <option value="Porto-Velho">RO</option> 
                    <option value="Boa-Vista">RR</option> 
                    <option value="Florianopolis">SC</option> 
                    <option value="Sao-Paulo">SP</option>  
                    <option value="Aracaju">SE</option>
                    <option value="Palmas">TO</option> 
                </datalist>
            </fieldset>  

            <fieldset>
                <legend>Como deseja contribuir?</legend>

                <label for="option-volunteer">Quero ser Voluntário</label>
                <input type="checkbox" id="option-volunteer" name="" required>

                <label for="option-donate">Quero fazer uma doação</label>
                <input type="checkbox" id="option-donate" name="" required>

                <label for="phone">Porque quer se juntar a nós?</label>
                <textarea type="" id="phone" name="phone" required>

                
            </fieldset>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>

        </form>
    </section>
   </main>
   <hr>
   <footer>

</body>
</html>
